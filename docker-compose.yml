# Startet die App und davor Caddy (holt automatisch HTTPS-Zertifikate).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - TRUST_PROXY=1
    volumes:
      - daten:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  daten:
  caddy_data:
  caddy_config:
