<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Badplaner VR – Planung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE professionelles Arbeitswerkzeug für die Beratung beim Kunden
   IDEA Planungstisch der Bäderausstellung: Skizze → Maßkette → Musterkarte → Preisschild
   PICTURE das realistisch beleuchtete, begehbare Bad selbst, groß und live
   COLOUR keramikweiß, tinte #13201f, petrol #0f5c63 führend, messing #b8832a Akzent
   TYPE Archivo 800 + Inter
   LAYOUT Laptop: 3D links bildschirmhoch, Planungsspalte 440px; Handy: 3D oben sticky (beim Zeichnen ausgeblendet), Schritte darunter */
:root{color-scheme:light dark;--bg:light-dark(#f7f7f4,#0e1515);--panel:light-dark(#ffffff,#152020);--ink:light-dark(#13201f,#e9efed);--mute:light-dark(#5b6a68,#9db0ad);--line:light-dark(#dde3e0,#263533);--pet:light-dark(#0f5c63,#4fb3ba);--petbg:light-dark(#e3eff0,#173236);--brass:#b8832a;--stage:#1a2021;--floor:light-dark(#f3efe7,#1e2a28);--wallc:light-dark(#2b3534,#c9d3d1);--grid:light-dark(#e6ebe9,#203030)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.stage{position:sticky;top:0;z-index:5;height:46svh;min-height:280px;background:var(--stage);overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.chipbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.brand,.hint{background:rgba(255,255,255,.92);color:#13201f;padding:6px 10px;border-radius:8px;font-size:13px}
.brand{font:800 15px Archivo,sans-serif}.brand b{color:#0f5c63}
.hint{max-width:60%;text-align:right}
.modes{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.95);padding:4px;border-radius:12px}
.modes button{border:0;background:none;color:#13201f;font:600 14px Inter,sans-serif;padding:10px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;min-height:40px}
.modes button.on{background:#0f5c63;color:#fff}
.mood{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;background:rgba(255,255,255,.95);border:0;border-radius:10px;padding:9px 11px;font:600 13px Inter,sans-serif;color:#13201f;cursor:pointer;min-height:40px}
.panel{padding:16px max(5vw,16px,env(safe-area-inset-right,0px)) 40px max(5vw,16px,env(safe-area-inset-left,0px))}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sum h1{font:800 clamp(24px,5vw,30px)/1.05 Archivo,sans-serif;letter-spacing:-.02em;margin:0}
.sum .tot{text-align:right}
.sum strong{display:block;font:800 24px Archivo,sans-serif;color:var(--pet);white-space:nowrap;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--mute)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin:14px 0 16px;background:var(--petbg);padding:4px;border-radius:12px}
.steps button{border:0;background:none;color:var(--ink);font:600 12.5px Inter,sans-serif;padding:6px 1px;border-radius:9px;cursor:pointer;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:1px}
.steps button b{font:800 15px Archivo,sans-serif;color:var(--mute)}
.steps button.on{background:var(--panel);color:var(--pet);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.steps button.on b{color:var(--pet)}
h2{font:700 17px Archivo,sans-serif;margin:20px 0 8px}
h2:first-child{margin-top:0}
.lead{margin:0 0 12px;color:var(--mute);font-size:14px}
.plan{width:100%;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.plan.big{aspect-ratio:1/1;max-height:70svh}
.plan.mid{max-height:380px}
.plan text{font-family:Inter,sans-serif}
.row{display:grid;grid-template-columns:6.5em minmax(0,1fr) 4.6em;align-items:center;gap:10px;margin-bottom:6px}
.row label{font-weight:500}
.row output{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--pet);height:32px}
.mass{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mass label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px;font-weight:600;font-size:14px;background:var(--panel)}
.mass label.on{border-color:var(--pet);background:var(--petbg)}
.mass input{font:600 16px Inter,sans-serif;width:100%;padding:6px 4px;border:0;background:none;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.mass small{color:var(--mute);font-weight:500}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip{display:block;text-align:left;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;font:inherit}
.chip i{display:block;height:68px;background-size:cover;background-position:center}
.chip span{display:block;padding:7px 10px 8px;font-size:13px;line-height:1.35}
.chip span b{display:block;font-size:14px}
.chip.on{border-color:var(--pet);box-shadow:0 0 0 2px var(--pet)}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button,.add button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:500 14px Inter,sans-serif;padding:8px 12px;border-radius:10px;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;text-align:left}
.seg button small{color:var(--mute);font-size:12.5px}
.seg button.on{border-color:var(--pet);background:var(--petbg);color:var(--pet);font-weight:600}
.add{display:flex;flex-wrap:wrap;gap:6px}
.add button{min-height:40px;padding:7px 11px}
.add button::before{content:"+";color:var(--pet);font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.2);flex:none}
.small{font-size:13px;color:var(--mute);margin:8px 0 0}
.card{border:1.5px solid var(--pet);border-radius:12px;padding:14px;margin-top:14px;background:var(--panel)}
.card h3{font:700 16px Archivo,sans-serif;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lbl{font-size:13px;color:var(--mute);margin:12px 0 6px}
.list{margin-top:14px;border-top:1px solid var(--line)}
.list button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:14px Inter,sans-serif;padding:10px 2px;cursor:pointer;text-align:left}
.list button.on{color:var(--pet);font-weight:600}
.list span:last-child{color:var(--mute);white-space:nowrap}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:14px}
.facts b{display:block;font:800 20px Archivo,sans-serif;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
td small{display:block;color:var(--mute);font-size:13px}
tfoot td{border:0;font:800 18px Archivo,sans-serif;padding-top:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:0;background:var(--pet);color:#fff;font:600 14px Inter,sans-serif;padding:11px 15px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.ghost{background:var(--petbg);color:var(--pet)}
.btn.warn{background:none;color:#b3412e;border:1.5px solid currentColor;padding:8px 12px;min-height:38px}
.note{margin-top:16px;padding:12px 14px;border-left:3px solid var(--brass);background:var(--petbg);border-radius:0 10px 10px 0;font-size:14px}
.msg{color:#b3412e;font-weight:600;font-size:14px;min-height:1.5em;margin:8px 0 0}
@media(max-width:899px){body.drawing .stage{display:none}}
@media(min-width:900px){.app{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:100%}.stage{height:100%;position:relative}.panel{overflow-y:auto;height:100%;padding:22px 22px 40px;border-left:1px solid var(--line);background:var(--panel)}}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.topnav a{color:var(--pet);font-weight:600;text-decoration:none}
#saved{color:var(--mute)}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="chipbar"><div class="brand">Badplaner <b>VR</b></div><div class="hint" id="hint">Ziehen zum Drehen · Objekt antippen</div></div>
    <div class="modes"><button id="m-orbit" class="on">Übersicht</button><button id="m-walk">Begehen</button><button id="m-vr">VR</button></div>
    <button class="mood" id="mood">Abendlicht</button>
  </div>
  <div class="panel">
    <div class="topnav"><a id="back" href="/">← Projekte</a><span id="saved"></span></div>
    <div class="sum"><h1 id="ptitle">Ihr neues Bad</h1><div class="tot"><strong id="total">–</strong><span>Material, ca.</span></div></div>
    <div class="steps" id="steps"><button data-tab="draw"><b>1</b>Zeichnen</button><button data-tab="mass"><b>2</b>Maße</button><button data-tab="obj"><b>3</b>Einrichten</button><button data-tab="mat"><b>4</b>Material</button><button data-tab="ang"><b>5</b>Angebot</button></div>
    <div id="pane"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</body>
</html>

const T={

   arms:[{id:'stand',name:'Standarmatur',price:149},{id:'hoch',name:'Hohe Armatur',price:219},{id:'wand',name:'Wandarmatur Unterputz',price:329}]},

   arms:[{id:'wand',name:'Wannenarmatur Aufputz',price:199},{id:'stand',name:'Standarmatur bodenstehend',price:590}]},
 hk:{label:'Heizkörper',vars:[{id:'hk',name:'Handtuchheizkörper 50 × 120',w:.5,d:.1,price:329}]},

const DEF=()=>({H:2.5,pts:PRESETS.rechteck.map(p=>[...p]),wall:'weiss',floor:'eiche',grout:'auto',tileH:'voll',finish:'chrom',furn:'eiche',accent:null,accentTile:'navy',mood:'tag',deko:true,nid:9,items:[
 {id:1,type:'tu',v:'t',wall:2,t:2},{id:2,type:'wt',v:'w80',arm:'stand',wall:0,t:.7},{id:3,type:'sp',v:'led',wall:0,t:.7,w:.8},{id:4,type:'wc',v:'wand',wall:0,t:1.65},

let S=DEF();const VID=new URLSearchParams(location.search).get('variant');let saveT=0;
const setSaved=t=>{const e=document.getElementById('saved');if(e)e.textContent=t};
const save=()=>{if(!VID){try{localStorage.setItem('badvr3',JSON.stringify(S))}catch(e){}return}clearTimeout(saveT);setSaved('Speichert …');
  saveT=setTimeout(async()=>{try{const r=await fetch('/api/variants/'+VID,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({plan:S})});if(r.status===401)return location.href='/';setSaved(r.ok?'Gespeichert ✓':'Nicht gespeichert!')}catch(e){setSaved('Offline – nicht gespeichert')}},600)};

/* ================= Geometrie ================= */
function wallsOf(p){const n=p.length;return p.map((A,i)=>{const B=p[(i+1)%n],dx=B[0]-A[0],dz=B[1]-A[1],len=Math.hypot(dx,dz)||.001;return{A,B,len,d:[dx/len,dz/len],n:[-dz/len,dx/len]}})}
const walls=()=>wallsOf(S.pts);
function areaOf(p){let s=0;p.forEach((a,i)=>{const b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]});return s/2}
function dims(it){const v=by(T[it.type].vars,it.v);return{w:it.w??v.w,d:v.d||0,h:it.h??v.h,y:it.y??v.y,v}}
function fixItems(){const W=walls();S.items.forEach(it=>{it.wall=clamp(it.wall,0,W.length-1);const w=dims(it).w,L=W[it.wall].len;it.t=clamp(it.t,Math.min(w/2,L/2),Math.max(L-w/2,L/2))})}
function isect(m1,u1,m2,u2){const den=u1[0]*u2[1]-u1[1]*u2[0];if(Math.abs(den)<1e-6)return null;const s=((m2[0]-m1[0])*u2[1]-(m2[1]-m1[1])*u2[0])/den;return[m1[0]+u1[0]*s,m1[1]+u1[1]*s]}
function offsetPoly(p,t){const W=wallsOf(p),n=W.length;return W.map((w,i)=>{const q=W[(i-1+n)%n];const m2=[w.A[0]-w.n[0]*t,w.A[1]-w.n[1]*t];return isect([q.A[0]-q.n[0]*t,q.A[1]-q.n[1]*t],q.d,m2,w.d)||m2})}
function segDist(p,a,b){const dx=b[0]-a[0],dz=b[1]-a[1],l=dx*dx+dz*dz;if(!l)return Math.hypot(p[0]-a[0],p[1]-a[1]);const t=clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dz)/l,0,1);return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dz)}
function rdp(P,eps){if(P.length<3)return P;let dm=0,ix=0;for(let i=1;i<P.length-1;i++){const d=segDist(P[i],P[0],P[P.length-1]);if(d>dm){dm=d;ix=i}}if(dm>eps){const l=rdp(P.slice(0,ix+1),eps),r=rdp(P.slice(ix),eps);return l.slice(0,-1).concat(r)}return[P[0],P[P.length-1]]}
function sketchToPoly(P){
  if(P.length<12)return null;let Q=rdp([...P,P[0]],.22);Q.pop();if(Q.length<3)return null;
  let E=Q.map((a,i)=>{const b=Q[(i+1)%Q.length],dx=b[0]-a[0],dz=b[1]-a[1];let deg=Math.atan2(dz,dx)*180/Math.PI;const s9=Math.round(deg/90)*90;deg=Math.abs(deg-s9)<23?s9:Math.round(deg/45)*45;const r=deg*Math.PI/180;return{m:[(a[0]+b[0])/2,(a[1]+b[1])/2],u:[Math.cos(r),Math.sin(r)],deg:((deg%360)+360)%360,len:Math.hypot(dx,dz)}}).filter(e=>e.len>.15);

const SYM={wc:'#ffffff',wt:'#ffffff',sp:'#dfe9ec',du:'#e6f2f4',wa:'#ffffff',hk:'#d0d5d8',vw:'#dcdfdb'};
function viewOf(pad){const xs=S.pts.map(p=>p[0]),zs=S.pts.map(p=>p[1]),x0=Math.min(...xs)-pad,z0=Math.min(...zs)-pad;return[x0,z0,Math.max(...xs)-x0+pad,Math.max(...zs)-z0+pad]}

    else if(it.type==='fe')q=`<rect x="${-hw}" y="-.155" width="${D.w}" height=".17" fill="var(--panel)" ${ln}/><line x1="${-hw}" y1="-.07" x2="${hw}" y2="-.07" ${ln}/>`;

        <rect x="${mx-fs*1.6}" y="${mz-fs*.75}" width="${fs*3.2}" height="${fs*1.5}" fill="transparent" transform="rotate(${ang} ${mx} ${mz})"/><text x="${mx}" y="${mz}" font-size="${fs}" font-weight="${on?700:600}" fill="${col}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${ang} ${mx} ${mz})">${cm(w.len)}</text></g>`}
    if(o.handles){const mx=(w.A[0]+w.B[0])/2,mz=(w.A[1]+w.B[1])/2;s+=`<rect data-w="${i}" data-drag="1" x="${mx-.08}" y="${mz-.08}" width=".16" height=".16" rx=".03" fill="var(--panel)" stroke="var(--pet)" stroke-width=".03" style="cursor:move"/>`}

  if(o.handles)S.pts.forEach((p,i)=>{s+=`<circle data-c="${i}" cx="${p[0]}" cy="${p[1]}" r=".1" fill="${i===selCorner?'var(--brass)':'var(--pet)'}" style="cursor:move"/>`});
  return`<svg class="plan mid" id="plan" viewBox="${vb.join(' ')}" data-o='${JSON.stringify(o)}'>${s}</svg>`}
function drawSVG(){const g=[];for(let i=0;i<=12;i++)g.push(`<line x1="${i*.5}" y1="0" x2="${i*.5}" y2="6" stroke="var(--grid)" stroke-width="${i%2?.01:.02}"/><line x1="0" y1="${i*.5}" x2="6" y2="${i*.5}" stroke="var(--grid)" stroke-width="${i%2?.01:.02}"/>`);

pane.addEventListener('input',e=>{const k=e.target.dataset.r;if(!k)return;const v=+e.target.value,it=S.items.find(x=>x.id===sel);if(k==='H')S.H=v;else if(it)it[k]=v;document.getElementById('o-'+k).textContent=cm(v)+' cm';save();queue()});
pane.addEventListener('change',e=>{const i=e.target.dataset.len;if(i==null)return;const v=clamp(+e.target.value||100,30,1200)/100;selWall=+i;setLen(+i,v);normalize();fixItems();save();build();render();});
pane.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.len!=null){e.preventDefault();const i=+e.target.dataset.len;e.target.blur();setTimeout(()=>{const nx=document.getElementById('len-'+((i+1)%S.pts.length));if(nx){nx.focus();nx.select()}},30)}});
pane.addEventListener('focusin',e=>{if(e.target.dataset.len!=null&&selWall!==+e.target.dataset.len){selWall=+e.target.dataset.len;const pl=document.getElementById('plan');if(pl)pl.innerHTML=planSVG({handles:1,walls:1}).replace(/^<svg[^>]*>|<\/svg>$/g,'');pane.querySelectorAll('.mass label').forEach((l,j)=>l.classList.toggle('on',j===selWall))}});
document.getElementById('steps').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;render()}});

(async()=>{
  if(VID){try{const r=await fetch('/api/variants/'+VID,{credentials:'same-origin'});if(r.status===401){location.href='/';return}const v=await r.json();if(!r.ok)throw new Error(v.error);
      document.getElementById('back').href='/#/projekt/'+v.project_id;document.getElementById('ptitle').textContent=v.customer_name;document.title=v.customer_name+' – '+v.name;
      if(v.plan&&v.plan.pts&&v.plan.items){S={...DEF(),...v.plan};tab='mass'}else{tab='draw'}setSaved(v.name)}
    catch(e){setSaved('Laden fehlgeschlagen: '+e.message)}}
  else{try{const s=JSON.parse(localStorage.getItem('badvr3')||'null');if(s&&s.pts&&s.items)S={...S,...s}}catch(e){}document.getElementById('back').hidden=true}
  bM.textContent=S.mood==='tag'?'Abendlicht':'Tageslicht';fixItems();build();fitOrbit();render();size()})();
}
</script>
</body>
</html>
