<style>
/* VOICE ruhiges, warmes Arbeitswerkzeug für die Beratung am Küchentisch
   IDEA Musterkarte aus der Ausstellung: erst aussuchen, dann den Raum ansehen

:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1b1814);--panel:light-dark(#ffffff,#25211c);--beige:light-dark(#f2eadd,#2e2922);--beigeb:light-dark(#e2d4bf,#433b31);--ink:light-dark(#2b2620,#f1ebe1);--mute:light-dark(#7a6e60,#b4a897);--line:light-dark(#e7dccd,#3a342c);--pet:light-dark(#566b4a,#a9bd96);--petbg:light-dark(#ebeedf,#2c3326);--brass:#b8862f;--stage:#2a2621;--floor:light-dark(#f3ebdf,#2a251f);--wallc:light-dark(#4a4136,#d9cfbf);--grid:light-dark(#ece3d6,#302a23);--bad:light-dark(#b0472f,#ec8f77);--shadow:0 6px 24px rgba(60,45,25,.12)}

*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(5vw,16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 110px) max(5vw,16px,env(safe-area-inset-left,0px))}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.topnav a{color:var(--pet);font-weight:600;text-decoration:none}
#saved{color:var(--mute)}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:14px}
.sum h1{font:800 clamp(26px,6vw,34px)/1.08 Archivo,sans-serif;letter-spacing:-.02em;margin:0}
.sum .tot{text-align:right}
.sum strong{display:block;font:800 24px Archivo,sans-serif;color:var(--pet);white-space:nowrap;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--mute)}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:4;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin:0 0 18px;background:color-mix(in srgb,var(--beige) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:5px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}

.plan{width:100%;display:block;background:light-dark(#fbf8f3,#221e19);border:1px solid var(--beigeb);border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.plan.big{aspect-ratio:1/1;max-height:70svh}

.plan text{font-family:Inter,sans-serif;pointer-events:none;user-select:none}
.row{display:grid;grid-template-columns:6.5em minmax(0,1fr) 4.6em;align-items:center;gap:10px;margin-bottom:6px}
.row label{font-weight:500}

table{width:100%;border-collapse:collapse;font-size:14px}

tfoot td{border:0;font:800 18px Archivo,sans-serif;padding-top:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.btn.warn{background:none;color:var(--bad);border:1.5px solid currentColor;padding:8px 12px;min-height:38px}
.note{margin-top:16px;padding:12px 14px;border-left:3px solid var(--brass);background:var(--petbg);border-radius:0 12px 12px 0;font-size:14px}
.msg{color:var(--bad);font-weight:600;font-size:14px;min-height:1.5em;margin:8px 0 0}
.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1.5px solid var(--beigeb);background:var(--beige);color:var(--ink);font:600 14px Inter,sans-serif;padding:9px 15px;border-radius:999px;cursor:pointer;min-height:44px;white-space:nowrap}
.cats button.on{background:var(--pet);border-color:var(--pet);color:#fff}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.models button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--beigeb);background:var(--beige);color:var(--ink);font:500 14px Inter,sans-serif;padding:11px 12px;border-radius:14px;cursor:pointer;min-height:64px}

.gl{font:700 13px Inter,sans-serif;color:var(--mute);margin:14px 0 8px}
details.all{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.all summary{cursor:pointer;font-weight:600;color:var(--pet);min-height:40px;display:flex;align-items:center}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--beigeb);background:var(--beige);color:var(--ink);font:inherit;border-radius:14px;padding:10px 14px;min-height:56px;margin-top:8px;cursor:pointer;box-shadow:0 2px 0 var(--beigeb)}
.pick .pt{flex:1;min-width:0}
.pick .pt span{display:block;font-size:12.5px;color:var(--mute);font-weight:500}
.pick .pt b{display:block;font-weight:650;font-size:15px;line-height:1.3}
.pick i.sw{width:40px;height:40px;border-radius:9px;background-size:cover;background-position:center;flex:none;border:1px solid var(--beigeb)}
.pick::after{content:"";width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin:-4px 4px 0;flex:none;transition:transform .15s}
.pick.open{border-color:var(--pet);background:var(--panel);box-shadow:none}
.pick.open::after{transform:rotate(-135deg);margin-top:4px}
.pickbox{padding:10px 2px 4px}
.seg button,.cats button,.models button,.chip,.add button{box-shadow:0 2px 0 var(--beigeb)}
.seg button.on,.cats button.on{box-shadow:none}
.cats{flex-wrap:wrap;overflow:visible}
.cats button{font-size:14.5px;padding:10px 16px}
.cats button.on::after{content:" ▴";font-size:11px}
.models{margin:4px 0 6px;padding:12px;background:light-dark(#faf6ef,#221e19);border-radius:16px;border:1px solid var(--beigeb)}
/* feste Leiste unten */
.viewbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.viewbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}

/* Vollbild-Ansicht */

.chipbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}

.hint{background:rgba(255,252,247,.92);color:#2b2620;padding:7px 10px;border-radius:10px;font-size:13px;max-width:55%;text-align:right}

.ctrl>*{pointer-events:auto}
.modes{display:flex;gap:4px;background:rgba(255,252,247,.95);padding:4px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.modes button{border:0;background:none;color:#2b2620;font:600 14px Inter,sans-serif;padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;min-height:42px}

.photo-btn{border:0;background:#b8862f;color:#fff;font:600 15.5px Inter,sans-serif;padding:13px 20px;border-radius:14px;cursor:pointer;min-height:50px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.photo-btn:disabled{opacity:.6}
.pmsg{background:rgba(255,252,247,.95);color:#2b2620;padding:8px 12px;border-radius:10px;font-size:13.5px;max-width:520px;text-align:center}
.pmsg.err{color:#b0472f;font-weight:600}
.gallery{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px}

.prow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
[hidden]{display:none!important}

// ---- Geometrie für den Rundgang (Raumkoordinaten wie S.pts) ----
function segCross(p,q,a,b){const cr=(x1,y1,x2,y2)=>x1*y2-y1*x2,r=[q[0]-p[0],q[1]-p[1]],v=[b[0]-a[0],b[1]-a[1]],den=cr(r[0],r[1],v[0],v[1]);if(Math.abs(den)<1e-9)return false;

function insideRoom(x,z){let c=false;S.pts.forEach((a,i)=>{const b=S.pts[(i+1)%S.pts.length];if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])c=!c});return c}

function tourSpots(maxN){const W=walls(),xs=S.pts.map(p=>p[0]),zs=S.pts.map(p=>p[1]),cand=[],FW=S.items.filter(isFree);
  const okPt=(x,z)=>insideRoom(x,z)&&W.every(w=>segDist([x,z],w.A,w.B)>=.3)&&FW.every(f=>segDist([x,z],f.a,f.b)>=.28)&&!inObstacle(x,z);
  for(let x=Math.min(...xs)+.3;x<=Math.max(...xs)-.3+1e-9;x+=.15)for(let z=Math.min(...zs)+.3;z<=Math.max(...zs)-.3+1e-9;z+=.15)if(okPt(x,z))cand.push([+x.toFixed(2),+z.toFixed(2)]);

  if(door){const w=W[door.wall],dp=[w.A[0]+w.d[0]*door.t+w.n[0]*.6,w.A[1]+w.d[1]*door.t+w.n[1]*.6];start=cand.reduce((b,c)=>Math.hypot(c[0]-dp[0],c[1]-dp[1])<Math.hypot(b[0]-dp[0],b[1]-dp[1])?c:b)}

  const md=c=>Math.min(...chosen.map(q=>vis(q,c)?Math.hypot(q[0]-c[0],q[1]-c[1]):9));

      okPanos().filter(p=>p!==b&&Math.hypot(p.x-b.x,p.z-b.z)<3).forEach(panoTex);if(pmRoute.length)pmNext();else pmMarksVis()}}}
fwBtn.onclick=()=>pmStart(null);
document.getElementById('wexit').onclick=()=>pmStop();
document.getElementById('wfwd').onclick=()=>pmDir(1);document.getElementById('wback').onclick=()=>pmDir(-1);
document.getElementById('pfree').onclick=()=>{const q=pCur,look={yaw:pLook.yaw,pitch:pLook.pitch};panoEl.classList.remove('open');pSensorOff();pmStart(q,look)};

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(panoEl.classList.contains('open')){panoEl.classList.remove('open');pSensorOff()}else if(viewer.classList.contains('open'))viewer.classList.remove('open');else if(stageEl.classList.contains('open'))close3d()}});

(async()=>{
  if(VID){try{const r=await fetch('/api/variants/'+VID,{credentials:'same-origin'});if(r.status===401){location.href='/';return}const v=await r.json();if(!r.ok)throw new Error(v.error);
      document.getElementById('back').href='/#/projekt/'+v.project_id;document.getElementById('ptitle').textContent=v.customer_name;document.title=v.customer_name+' – '+v.name;
      if(v.plan&&v.plan.pts&&v.plan.items){S={...DEF(),...v.plan};tab='mass'}else{tab='draw'}setSaved(v.name)}
    catch(e){setSaved('Laden fehlgeschlagen: '+e.message)}}
  else{try{const s=JSON.parse(localStorage.getItem('badvr3')||'null');if(s&&s.pts&&s.items)S={...S,...s}}catch(e){}document.getElementById('back').hidden=true}
  bM.textContent=S.mood==='tag'?'Abendlicht':'Tageslicht';fixItems();build();fitOrbit();render();size();
  if(VID&&location.hash==='#rundgang'){await loadPhotos();if(panos.length)openPano(panos[0].id)}})();
}
</script>
