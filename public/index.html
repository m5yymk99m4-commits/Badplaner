<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<title>Badplaner VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5efe6,#1b1814);--panel:light-dark(#fffcf7,#25211c);--ink:light-dark(#2b2620,#f1ebe1);--mute:light-dark(#7a6e60,#b4a897);--line:light-dark(#e7dccd,#3a342c);--pet:light-dark(#566b4a,#a9bd96);--petbg:light-dark(#ebeedf,#2c3326);--brass:#b8862f;--bad:light-dark(#b0472f,#ec8f77);--soft:light-dark(#efe6d8,#2c2721);--shadow:0 6px 24px rgba(60,45,25,.10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font:800 18px Archivo,sans-serif;text-decoration:none;color:var(--ink);white-space:nowrap}.brand b{color:var(--pet)}
nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;padding:8px 8px;border-radius:9px}
nav a.on{background:var(--petbg);color:var(--pet)}
h1{font:800 clamp(28px,6vw,38px)/1.05 Archivo,sans-serif;letter-spacing:-.02em;margin:6px 0 14px}
h2{font:700 18px Archivo,sans-serif;margin:26px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input,textarea,select{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pet);outline-offset:1px;border-color:var(--pet)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--pet);color:#fff;font:600 15px Inter,sans-serif;padding:12px 18px;border-radius:12px;cursor:pointer;min-height:48px;text-decoration:none}
.btn.ghost{background:var(--petbg);color:var(--pet)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.warn{background:none;border:1.5px solid currentColor;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:10px 0 0;font-size:14px}
.ok{color:var(--pet);font-weight:600;font-size:14px;margin:10px 0 0}
.search{display:flex;gap:8px;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:500 14px Inter,sans-serif;padding:7px 12px;border-radius:20px;cursor:pointer;min-height:38px}
.filters button.on{border-color:var(--pet);background:var(--petbg);color:var(--pet);font-weight:600}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.item b{font-size:17px}
.item small{color:var(--mute);font-size:14px;grid-column:1}
.pill{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--petbg);color:var(--pet);white-space:nowrap;grid-row:1/3;grid-column:2}
.pill.angebot{background:light-dark(#f6e6c8,#3a3020);color:light-dark(#7a5414,#e3c58c)}.pill.auftrag{background:light-dark(#e2ecd6,#26331f);color:light-dark(#3f5a2c,#b5d39c)}.pill.abgeschlossen{background:var(--line);color:var(--mute)}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.var{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.var:last-child{border-bottom:0}
.var b{font-size:16px}.var small{display:block;color:var(--mute);font-size:13px}
.var .acts{margin:0}
.var .btn{min-height:40px;padding:8px 12px;font-size:14px}
.tag{font-size:12px;font-weight:700;color:var(--brass);margin-left:6px}
.note{margin-top:14px;padding:12px 14px;border-left:3px solid var(--brass);background:var(--petbg);border-radius:0 10px 10px 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:500 14px Inter,sans-serif;padding:8px 12px;border-radius:20px;cursor:pointer;min-height:40px}
.chips button.on{border-color:var(--pet);background:var(--petbg);color:var(--pet);font-weight:600}
.ai{border:1.5px solid var(--pet)}
.ai h3{font:700 16px Archivo,sans-serif;margin:18px 0 4px}
.ai h3:first-child{margin-top:0}
.btn.big{width:100%;min-height:54px;font-size:16px}
.prog{margin-top:12px;font-size:14px;color:var(--mute)}
.prog b{color:var(--pet)}
.vnote{font-size:14px;color:var(--ink);margin:4px 0 0;max-width:60ch}
.warnbox{font-size:13.5px;color:light-dark(#7a5414,#e3c58c);background:light-dark(#f6e6c8,#3a3020);border-radius:8px;padding:8px 10px;margin-top:8px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.idea{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.idea .pic{position:relative;display:block;height:190px;background:var(--soft)}
.idea .pic img{width:100%;height:100%;object-fit:cover;display:block}
.idea .pic svg{position:absolute;right:8px;bottom:8px;width:72px;height:54px;background:rgba(255,252,247,.9);border-radius:8px;padding:3px}
.idea .pic .tag2{position:absolute;left:8px;top:8px;background:rgba(43,38,32,.75);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.idea>svg{display:block;width:100%;height:190px;background:var(--soft)}
.idea .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.idea b{font:700 17px Archivo,sans-serif}
.idea p{margin:0;font-size:14px;color:var(--ink)}
.idea .acts{margin-top:auto;padding-top:6px}
.idea .btn{min-height:42px;padding:9px 14px;font-size:14px}
.stepc{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 12px;margin-bottom:14px}
.stepc .n{width:30px;height:30px;border-radius:50%;background:var(--pet);color:#fff;font:800 15px Archivo,sans-serif;display:grid;place-items:center}
.stepc h3{font:700 17px Archivo,sans-serif;margin:3px 0 8px}
.room{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.room svg{width:150px;height:110px;flex:none;background:var(--soft);border-radius:12px}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;color:var(--pet);min-height:36px;display:flex;align-items:center}
.count{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.trend{white-space:pre-wrap;font-size:14px;line-height:1.5;background:var(--bg);border-radius:10px;padding:12px;max-height:340px;overflow:auto;margin:10px 0 0}
.src{font-size:13px;margin:8px 0 0;padding-left:18px}
.src li{margin:3px 0;overflow-wrap:anywhere}
.login{max-width:400px;margin:10vh auto 0}
.login h1{margin-bottom:6px}
.muted{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Lädt …</p></div>
<script>
{
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={neu:'Neu',in_planung:'In Planung',angebot:'Angebot',auftrag:'Auftrag',abgeschlossen:'Abgeschlossen'};
const fmt=d=>{try{return new Date(d.replace(' ','T')+'Z').toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return d}};
let me=null,filter='alle',query='';
async function api(path,method='GET',body){
  const r=await fetch(path,{method,headers:body!==undefined||method!=='GET'?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):method!=='GET'?'{}':undefined,credentials:'same-origin'});
  const data=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='/api/login'){me=null;showLogin();throw new Error('abgemeldet')}
  if(!r.ok)throw new Error(data.error||'Fehler '+r.status);
  return data}
function shell(active,inner){
  app.innerHTML=`<header><a class="brand" href="#/">Badplaner <b>VR</b></a><nav>
    <a href="#/" class="${active==='p'?'on':''}">Projekte</a>${me.role==='admin'?`<a href="#/team" class="${active==='t'?'on':''}">Team</a><a href="#/ki" class="${active==='a'?'on':''}">KI</a>`:''}<a href="#/konto" class="${active==='k'?'on':''}">Konto</a></nav></header>${inner}<p class="muted" style="font-size:12.5px;margin-top:36px;text-align:center">Version ${esc(me.version||'?')}</p>`}
function showLogin(){
  app.innerHTML=`<div class="login"><div class="brand">Badplaner <b>VR</b></div><h1>Anmelden</h1><p class="muted">Nur für Mitarbeiter.</p>
  <form class="card" id="f"><label for="em">E-Mail</label><input id="em" type="email" autocomplete="username" autocapitalize="off" required>
  <label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="shp" style="width:auto"> Passwort anzeigen</label>
  <div class="acts"><button class="btn" style="width:100%">Anmelden</button></div><p class="err" id="err"></p></form></div>`;
  shp.onchange=()=>{pw.type=shp.checked?'text':'password'};
  document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{me=await api('/api/login','POST',{email:em.value.trim(),password:pw.value});route()}catch(x){err.textContent=x.message}}}

async function viewProjects(){
  shell('p',`<h1>Kundenprojekte</h1><div class="search"><input id="q" type="search" placeholder="Kunde oder Adresse suchen" value="${esc(query)}"><a class="btn" href="#/neu">+ Neu</a></div>
    <div class="filters" id="fl">${['alle',...Object.keys(STATUS)].map(s=>`<button data-s="${s}" class="${filter===s?'on':''}">${s==='alle'?'Alle':STATUS[s]}</button>`).join('')}</div><div class="list" id="ls"><p class="muted">Lädt …</p></div>`);
  const all=await api('/api/projects');
  const draw=()=>{const q=query.toLowerCase(),rows=all.filter(p=>(filter==='alle'||p.status===filter)&&(p.customer_name+' '+p.address).toLowerCase().includes(q));
    ls.innerHTML=rows.length?rows.map(p=>`<a class="item" href="#/projekt/${p.id}"><b>${esc(p.customer_name)}</b><span class="pill ${p.status}">${STATUS[p.status]}</span><small>${esc(p.address||'Keine Adresse')} · ${p.variant_count} Variante${p.variant_count===1?'':'n'} · ${fmt(p.updated_at)}</small></a>`).join('')
      :`<div class="empty">${all.length?'Keine Treffer.':'Noch keine Projekte. Legen Sie das erste Kundenprojekt an.'}</div>`};
  draw();q.oninput=()=>{query=q.value;draw()};
  fl.onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.s;fl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw()}}

const custForm=(p={})=>`<div class="grid2"><div><label for="cn">Name *</label><input id="cn" required value="${esc(p.customer_name)}"></div><div><label for="ad">Adresse</label><input id="ad" value="${esc(p.address)}" autocomplete="street-address"></div>
  <div><label for="ph">Telefon</label><input id="ph" type="tel" value="${esc(p.phone)}"></div><div><label for="ml">E-Mail</label><input id="ml" type="email" value="${esc(p.email)}"></div></div>
  <label for="nt">Notizen</label><textarea id="nt" placeholder="z. B. Bad im OG, Fenster bleibt, Kunde möchte bodengleiche Dusche">${esc(p.notes)}</textarea>`;
const custData=()=>({customer_name:cn.value,address:ad.value,phone:ph.value,email:ml.value,notes:nt.value});
function viewNew(){
  shell('p',`<h1>Neues Projekt</h1><form class="card" id="f">${custForm()}<div class="acts"><button class="btn">Projekt anlegen</button><a class="btn line" href="#/">Abbrechen</a></div><p class="err" id="err"></p></form>`);
  f.onsubmit=async e=>{e.preventDefault();try{const p=await api('/api/projects','POST',custData());location.hash='#/projekt/'+p.id}catch(x){err.textContent=x.message}}}

const WISH={
  stil:{l:'Stil',o:['Modern','Natürlich & warm','Skandinavisch','Industrial','Klassisch','Wie im Hotel']},
  nutzung:{l:'Dusche oder Wanne',o:['Nur Dusche','Nur Wanne','Dusche und Wanne']},
  barrierefrei:{l:'Barrierefrei / altersgerecht',o:['Nein','Ja, altersgerecht','Ja, rollstuhlgerecht']},
  waschtisch:{l:'Waschtisch',o:['Einzel','Doppel','Egal']},
  wc:{l:'WC',o:['Wand-WC','Dusch-WC','Egal']},
  stauraum:{l:'Stauraum',o:['Wenig','Normal','Viel']}};
// Mini-Grundriss als Vorschaubild
const DIM={wc:{wand:[.37,.54],stand:[.37,.68],dusch:[.4,.58],bidet:[.37,.54]},wt:{h45:[.45,.32],w60:[.6,.46],w80:[.8,.48],w100:[1,.48],w120:[1.2,.48],w140:[1.4,.48],auf:[1,.5],auf2:[1.4,.5]},du:{walk:[1.2,.9],walk140:[1.4,.9],eck:[.9,.9],nische:[1,.9]},wa:{r170:[1.7,.75],r180:[1.8,.8],frei:[1.7,.95]},hk:{hk:[.5,.1],hk60:[.6,.1]},vw:{v:[1.2,.2]},tw:{halb:[.12,.9],hoch:[.12,.9]},mo:{hoch:[.4,.35],seite:[.4,.35],wm:[.62,.62]}};
const FLOORC={eiche:'#c79a6a',eichehell:'#d6b88f',nuss:'#7a5539',anthrazit:'#55585c',schwarzf:'#2e2e2f',terrazzo:'#e3ddd2',marmorb:'#eeebe5',weissf:'#ebe9e4',grauf:'#cfcdc8',greigef:'#bdb3a4',sandf:'#d0c0a3',betonf:'#8f8c86'},WALLC={weiss:'#3b4544',mattweiss:'#5a554c',hellgrau:'#8f8d88',greige:'#9c9282',sand:'#a8987b',anthw:'#57595c',schwarzw:'#2a2a2b',beton:'#8d8b85',marmor:'#a9a59d',travertin:'#a99a83',salbei:'#6f8c70',creme:'#b9ab8c',rosa:'#b98b7f',hellblau:'#7d9cb0',navy:'#23395b'},FURNC={eiche:'#a57a4f',eichehell:'#cfae86',nuss:'#6a4732',weiss:'#f3f3f1',weissm:'#ecebe6',beige:'#d7cbb8',anth:'#3a3c40',gruen:'#7d917d'};
function planThumb(pl){
  if(!pl||!pl.pts||pl.pts.length<3)return'<svg viewBox="0 0 1 1"></svg>';
  const P=pl.pts,xs=P.map(p=>p[0]),zs=P.map(p=>p[1]),pad=.25,x0=Math.min(...xs)-pad,z0=Math.min(...zs)-pad,vw=Math.max(...xs)-x0+pad,vh=Math.max(...zs)-z0+pad;
  const W=P.map((A,i)=>{const B=P[(i+1)%P.length],dx=B[0]-A[0],dz=B[1]-A[1],l=Math.hypot(dx,dz)||.001;return{A,d:[dx/l,dz/l],n:[-dz/l,dx/l],l}});
  const wc=WALLC[pl.wall]||'#3b4544';let s=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="${FLOORC[pl.floor]||'#eee'}" stroke="${wc}" stroke-width=".09" stroke-linejoin="miter"/>`;
  (pl.items||[]).forEach(it=>{const w=W[it.wall];if(!w)return;const f=it.flip?-1:1,px=w.A[0]+w.d[0]*it.t,pz=w.A[1]+w.d[1]*it.t,m=`matrix(${w.d[0]*f},${w.d[1]*f},${w.n[0]},${w.n[1]},${px},${pz})`;
    if(it.type==='tu'){const tw=it.w||.86;s+=`<g transform="${m}"><rect x="${-tw/2}" y="-.06" width="${tw}" height=".1" fill="${FLOORC[pl.floor]||'#eee'}"/><path d="M${-tw/2} 0V${tw}A${tw} ${tw} 0 0 0 ${tw/2} 0" fill="none" stroke="#7d8a88" stroke-width=".025"/></g>`;return}
    if(it.type==='fe'){const tw=it.w||.9;s+=`<rect transform="${m}" x="${-tw/2}" y="-.06" width="${tw}" height=".08" fill="#9fd0e8"/>`;return}
    const dm=(DIM[it.type]||{})[it.v];if(!dm)return;const ww=it.w||dm[0],dd=it.d||dm[1];
    if(it.type==='tw'){s+=`<rect transform="${m}" x="${-ww/2}" y="0" width="${ww}" height="${dd}" fill="${wc}"/>`;return}
    const fill=it.type==='wt'||it.type==='mo'&&it.v!=='wm'?(FURNC[pl.furn]||'#a57a4f'):it.type==='du'?'#cfe8ee':it.type==='hk'||it.type==='vw'?'#b9bfc0':'#ffffff';
    const rx=it.type==='wa'&&it.v==='frei'?.3:.03;s+=`<rect transform="${m}" x="${-ww/2}" y="0" width="${ww}" height="${dd}" rx="${rx}" fill="${fill}" stroke="#55605e" stroke-width=".02"/>`;
    if(it.type==='wc')s+=`<ellipse transform="${m}" cx="0" cy="${dd*.6}" rx=".14" ry="${dd*.33}" fill="none" stroke="#55605e" stroke-width=".02"/>`;});
  return`<svg viewBox="${x0} ${z0} ${vw} ${vh}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${s}</svg>`}
let aiTimer=0,ideaCount=4;
async function viewProject(id){
  const p=await api('/api/projects/'+id),w=p.wishes||{},rooms=p.variants.filter(v=>v.has_room&&v.source!=='ki');
  const ideas=p.variants.filter(v=>v.source==='ki').reverse(),own=p.variants.filter(v=>v.source!=='ki');
  const chipRow=k=>`<label>${WISH[k].l}</label><div class="chips" data-w="${k}">${WISH[k].o.map(o=>`<button type="button" class="${w[k]===o?'on':''}">${esc(o)}</button>`).join('')}</div>`;
  const base=rooms[0];
  shell('p',`<p style="margin:0"><a href="#/" class="muted">← Alle Projekte</a></p><h1>${esc(p.customer_name)}</h1>
    <div class="card ai" id="wf">
      <div class="stepc"><span class="n">1</span><div><h3>Raum</h3>
        ${base?`<div class="room">${planThumb(base.plan)}<div>${rooms.length>1?`<label for="abase" style="margin-top:0">Grundriss aus</label><select id="abase">${rooms.map(v=>`<option value="${v.id}" ${v===base?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`:`<input type="hidden" id="abase" value="${base.id}">`}
          <div class="acts" style="margin-top:10px"><a class="btn line" id="aedit" href="planner.html?variant=${base.id}">Raum bearbeiten</a></div></div></div>`
        :`<p style="margin:0 0 10px">Zeichne den Raum mit dem Finger und trag die Maße ein. Tür und Fenster setzt du unter „Einrichten“.</p><a class="btn" href="planner.html?variant=${own[0]?own[0].id:p.variants[0].id}">Raum aufnehmen</a>`}
      </div></div>
      <div class="stepc"><span class="n">2</span><div><h3>Was wünscht sich der Kunde?</h3>
        <textarea id="wft" style="min-height:120px" placeholder="z. B. Helles, modernes Bad mit bodengleicher Dusche und viel Holz. Die Waschmaschine soll rein. Zwei Personen, eher wenig Stauraum.">${esc(w.freitext)}</textarea>
        <p class="muted" style="font-size:13.5px;margin:6px 0 0">Tipp: Auf der iPhone-Tastatur das Mikrofon antippen und einfach sprechen.</p>
        <label for="wbu">Budget für Material (€, optional)</label><input id="wbu" type="number" inputmode="numeric" min="0" step="500" value="${esc(w.budget)}" placeholder="z. B. 10000">
        <details class="more"><summary>Mehr Angaben (optional)</summary>
          ${chipRow('stil')}<label for="wfa">Farben und Materialien</label><input id="wfa" value="${esc(w.farben)}" placeholder="z. B. hell, Holz, etwas Grün">
          <label for="wpe">Personen im Haushalt</label><input id="wpe" type="number" inputmode="numeric" min="1" max="12" value="${esc(w.personen)}">
          ${chipRow('nutzung')}${chipRow('barrierefrei')}${chipRow('waschtisch')}${chipRow('wc')}${chipRow('stauraum')}
          <label for="wso">Sonstiges</label><textarea id="wso">${esc(w.sonstiges)}</textarea></details>
      </div></div>
      <div class="stepc" style="margin-bottom:0"><span class="n">3</span><div><h3>Ideen erstellen</h3>
        <div class="count">Anzahl Ideen:<div class="chips" id="acnt">${[3,4,5].map(n=>`<button type="button" class="${n===ideaCount?'on':''}">${n}</button>`).join('')}</div></div>
        <button class="btn big" id="ago" type="button" ${base?'':'disabled'}>✦ Ideen erstellen</button>
        ${base?'':'<p class="muted" style="font-size:13.5px;margin:6px 0 0">Zuerst den Raum aufnehmen (Schritt 1).</p>'}
        <p class="prog" id="aprog"></p><p class="err" id="aerr"></p></div></div>
    </div>
    <h2 id="ih">Ideen der KI${ideas.length?` (${ideas.length})`:''}</h2>
    ${ideas.length?`<div class="ideas" id="il">${ideas.map(v=>`<div class="idea">${v.photo_id?`<a class="pic" href="planner.html?variant=${v.id}"><img src="/api/photos/${v.photo_id}" alt="KI-Foto: ${esc(v.name)}" loading="lazy"><span class="tag2">KI-Foto</span>${planThumb(v.plan)}</a>`:planThumb(v.plan)}<div class="in"><b>${esc(v.name)}</b>${v.note?`<p>${esc(v.note)}</p>`:''}
      <div class="acts"><a class="btn" href="planner.html?variant=${v.id}">Ansehen &amp; anpassen</a>${v.pano_count?`<a class="btn ghost" href="planner.html?variant=${v.id}#rundgang">360°-Rundgang</a>`:''}<button class="btn warn" data-del="${v.id}">Löschen</button></div></div></div>`).join('')}</div><p class="muted" style="font-size:13.5px;margin:10px 0 0">Echte Fotos und 360°-Rundgang: Idee öffnen, unten „Zwischenstand ansehen“ und dann „Echtes Foto“ oder „360° hier aufnehmen“.</p>`
      :'<p class="muted">Noch keine Ideen. Raum aufnehmen, Wunsch eintragen und auf „Ideen erstellen“ tippen.</p>'}
    <h2>Eigene Planungen</h2><div class="card" id="vs">${own.map(v=>`<div class="var"><div><b>${esc(v.name)}</b><small>${v.has_room?'':'Noch kein Grundriss · '}Geändert ${fmt(v.updated_at)}</small></div>
      <div class="acts"><a class="btn" href="planner.html?variant=${v.id}">Planen</a><button class="btn ghost" data-copy="${v.id}">Kopieren</button><button class="btn line" data-ren="${v.id}" data-name="${esc(v.name)}">Umbenennen</button>${p.variants.length>1?`<button class="btn warn" data-del="${v.id}">Löschen</button>`:''}</div></div>`).join('')}
      <div class="acts"><button class="btn ghost" id="nv">+ Leere Variante</button></div><p class="err" id="verr"></p></div>
    <h2>Kunde</h2><div class="card"><label for="st" style="margin-top:0">Status</label><select id="st">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select>
    <details class="more"><summary>Kundendaten bearbeiten</summary><form id="f">${custForm(p)}<div class="acts"><button class="btn">Speichern</button></div><p class="err" id="err"></p></form></details></div>
    <div class="acts"><button class="btn warn" id="dp">Projekt löschen</button></div>`);
  st.onchange=()=>api('/api/projects/'+id,'PUT',{status:st.value});
  wf.querySelectorAll('.chips[data-w]').forEach(c=>c.onclick=e=>{const b=e.target.closest('button');if(!b)return;const on=!b.classList.contains('on');c.querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(on)b.classList.add('on')});
  acnt.onclick=e=>{const b=e.target.closest('button');if(!b)return;ideaCount=+b.textContent;acnt.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
  if(window.abase&&abase.tagName==='SELECT')abase.onchange=()=>{aedit.href='planner.html?variant='+abase.value;const v=rooms.find(r=>r.id==abase.value);wf.querySelector('.room svg').outerHTML=planThumb(v.plan)};
  const wishes=()=>{const o={freitext:wft.value.trim(),budget:wbu.value,farben:wfa.value.trim(),personen:wpe.value,sonstiges:wso.value.trim()};wf.querySelectorAll('.chips[data-w]').forEach(c=>{const b=c.querySelector('.on');o[c.dataset.w]=b?b.textContent:''});return o};
  let saveT=0;wf.addEventListener('input',()=>{clearTimeout(saveT);saveT=setTimeout(()=>api('/api/projects/'+id,'PUT',{wishes:wishes()}).catch(()=>{}),800)});
  ago.onclick=async()=>{if(ago.disabled)return;aerr.textContent='';ago.disabled=true;const t0=Date.now();clearInterval(aiTimer);
    const tick=()=>{if(!document.getElementById('aprog')){clearInterval(aiTimer);return}const s=Math.round((Date.now()-t0)/1000);aprog.innerHTML=`<b>Die KI plant ${ideaCount} Ideen …</b> ${s} s · dauert meist 1 bis 3 Minuten. Bitte die Seite offen lassen.`};tick();aiTimer=setInterval(tick,1000);
    try{await api('/api/projects/'+id,'PUT',{wishes:wishes()});const r=await api(`/api/projects/${id}/ai-design`,'POST',{base_variant_id:+abase.value,count:ideaCount});clearInterval(aiTimer);
      await viewProject(id);const warn=(r.hinweise||[]).filter(h=>h.length).length;
      aprog.innerHTML=`<b>${r.created.length} neue Ideen ✓</b>`+(warn?`<span class="warnbox" style="display:block">Bei ${warn} Idee${warn>1?'n':''} stehen Objekte eventuell zu eng. Bitte beim Ansehen prüfen.</span>`:'');
      document.getElementById('ih').scrollIntoView({behavior:'smooth',block:'start'})}
    catch(x){clearInterval(aiTimer);if(document.getElementById('aprog')){aprog.textContent='';aerr.className='err';aerr.textContent=x.message;ago.disabled=false}}};
  f.onsubmit=async e=>{e.preventDefault();try{await api('/api/projects/'+id,'PUT',custData());err.className='ok';err.textContent='Gespeichert ✓'}catch(x){err.className='err';err.textContent=x.message}};
  nv.onclick=async()=>{await api(`/api/projects/${id}/variants`,'POST',{});viewProject(id)};
  const onList=async e=>{const b=e.target.closest('button');if(!b)return;try{
    if(b.dataset.copy){await api(`/api/projects/${id}/variants`,'POST',{copy_from:+b.dataset.copy});viewProject(id)}
    if(b.dataset.ren){const row=b.closest('.var'),cur=b.dataset.name;row.innerHTML=`<input value="${esc(cur)}" style="flex:1;min-width:160px" aria-label="Neuer Name"><div class="acts"><button class="btn" data-save="${b.dataset.ren}">OK</button></div>`;row.querySelector('input').focus()}
    if(b.dataset.save){await api('/api/variants/'+b.dataset.save,'PUT',{name:b.closest('.var').querySelector('input').value});viewProject(id)}
    if(b.dataset.del){if(b.dataset.sure){await api('/api/variants/'+b.dataset.del,'DELETE');viewProject(id)}else{b.dataset.sure=1;b.textContent='Wirklich löschen?'}}
  }catch(x){verr.textContent=x.message}};
  vs.onclick=onList;if(window.il)il.onclick=onList;
  dp.onclick=async()=>{if(!dp.dataset.sure){dp.dataset.sure=1;dp.textContent='Wirklich das ganze Projekt löschen?';return}await api('/api/projects/'+id,'DELETE');location.hash='#/'}}

async function viewAi(){
  const s=await api('/api/settings');
  shell('a',`<h1>KI-Einstellungen</h1><p class="muted">Nur für Admins sichtbar. Kundenname und Adresse werden nie an die KI geschickt, nur Grundriss und Wünsche.</p>
    <h2>Zugang zur KI</h2><form class="card" id="kf">
      <p style="margin:0">${s.has_key?`Schlüssel hinterlegt: <b>${esc(s.key_hint)}</b>`:'<b>Noch kein Schlüssel hinterlegt.</b> Ohne Schlüssel kann die KI nicht planen.'}</p>
      <label for="kk">${s.has_key?'Neuen Schlüssel einfügen (optional)':'Schlüssel einfügen'}</label><input id="kk" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-ant-…">
      <p class="muted" style="font-size:13.5px;margin:6px 0 0">Den Schlüssel erstellst du unter <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
      <label for="km">KI-Modell</label><input id="km" value="${esc(s.model)}" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="acts"><button class="btn">Speichern</button><button class="btn ghost" type="button" id="kt">Verbindung testen</button></div><p class="err" id="kerr"></p></form>
    <h2>Echte Fotos (Bild-KI)</h2><form class="card" id="of">
      <p style="margin:0">${s.has_openai?`Schlüssel hinterlegt: <b>${esc(s.openai_hint)}</b>`:'<b>Noch kein Schlüssel hinterlegt.</b> Ohne ihn kann die App keine echten Fotos erstellen.'}</p>
      <label for="ok">${s.has_openai?'Neuen Schlüssel einfügen (optional)':'OpenAI-Schlüssel einfügen'}</label><input id="ok" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-…">
      <p class="muted" style="font-size:13.5px;margin:6px 0 0">Den Schlüssel erstellst du unter <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com</a>. Die 3D-Ansicht wird dort in ein Foto verwandelt, Kundendaten werden nicht übertragen.</p>
      <label for="oq">Fotoqualität</label><select id="oq"><option value="medium" ${s.image_quality==='medium'?'selected':''}>Standard (schneller, günstiger)</option><option value="high" ${s.image_quality!=='medium'&&s.image_quality!=='low'?'selected':''}>Hoch (empfohlen)</option></select>
      <label for="om">Bild-Modell (optional)</label><input id="om" value="${esc(s.image_model)}" placeholder="leer lassen = aktuelles Standardmodell von OpenAI" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="acts"><button class="btn">Speichern</button><button class="btn ghost" type="button" id="ot">Verbindung testen</button></div><p class="err" id="oerr"></p></form>
    <h2>Trends aus dem Internet</h2><div class="card">
      <p style="margin:0">${s.web_trends_at?`Zuletzt recherchiert: <b>${new Date(s.web_trends_at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</b>. Die KI sucht einmal pro Woche selbst nach neuen Trends.`:'Noch keine Trends recherchiert. Die KI holt sie automatisch, sobald ein Schlüssel hinterlegt ist, oder du startest es hier.'}</p>
      <div class="acts"><button class="btn ghost" type="button" id="tr">Trends jetzt recherchieren</button></div><p class="err" id="trerr"></p>
      ${s.web_trends?`<div class="trend">${esc(s.web_trends)}</div>`:''}
      ${(s.web_trends_sources||[]).length?`<details class="more"><summary>Quellen (${s.web_trends_sources.length})</summary><ul class="src">${s.web_trends_sources.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join('')}</ul></details>`:''}</div>
    <h2>Hausregeln</h2><form class="card" id="tf">
      <p class="muted" style="margin:0 0 8px;font-size:14px">Was die KI immer beachten soll, egal was gerade Trend ist: eure Lieblingsprodukte und Regeln aus der Praxis. Kurze Stichpunkte reichen.</p>
      <textarea id="tt" style="min-height:180px" maxlength="6000" placeholder="- Bei Bädern unter 5 m² immer Wand-WC&#10;- Schwarze Armaturen nur zu hellen Fliesen&#10;- Duschtassen nur auf Wunsch">${esc(s.trends)}</textarea>
      <div class="acts"><button class="btn">Speichern</button></div><p class="err" id="terr"></p></form>`);
  const osave=()=>api('/api/settings','PUT',{openai_key:ok.value,image_quality:oq.value,image_model:om.value});
  of.onsubmit=async e=>{e.preventDefault();oerr.className='err';try{const r=await osave();oerr.className='ok';oerr.textContent=r.moved==='anthropic'?'Das war ein Anthropic-Schlüssel. Ich habe ihn automatisch oben bei „Zugang zur KI“ gespeichert ✓':'Gespeichert ✓';if(ok.value)setTimeout(viewAi,r.moved?2500:700)}catch(x){oerr.textContent=x.message}};
  ot.onclick=async()=>{oerr.className='muted';oerr.textContent='Teste …';try{await osave();const r=await api('/api/settings/test-image','POST');oerr.className='ok';oerr.textContent='Verbindung klappt ✓'+(r.models&&r.models.length?' · Bild-Modelle: '+r.models.slice(0,6).join(', '):'')}catch(x){oerr.className='err';oerr.textContent=x.message}};
  tr.onclick=async()=>{tr.disabled=true;trerr.className='muted';const t0=Date.now(),iv=setInterval(()=>{trerr.textContent=`Die KI durchsucht das Internet … ${Math.round((Date.now()-t0)/1000)} s (dauert meist 1 bis 2 Minuten)`},1000);
    try{const r=await api('/api/settings/trends','POST');clearInterval(iv);trerr.className='ok';trerr.textContent=`Fertig ✓ ${r.sources} Quellen ausgewertet.`;setTimeout(viewAi,900)}catch(x){clearInterval(iv);trerr.className='err';trerr.textContent=x.message;tr.disabled=false}};
  kf.onsubmit=async e=>{e.preventDefault();kerr.className='err';try{const r=await api('/api/settings','PUT',{key:kk.value,model:km.value});kerr.className='ok';kerr.textContent=r.moved==='openai'?'Das war ein OpenAI-Schlüssel. Ich habe ihn automatisch bei „Echte Fotos“ gespeichert ✓':'Gespeichert ✓';if(kk.value)setTimeout(viewAi,r.moved?2500:700)}catch(x){kerr.textContent=x.message}};
  kt.onclick=async()=>{kerr.className='muted';kerr.textContent='Teste …';try{if(kk.value||km.value!==s.model)await api('/api/settings','PUT',{key:kk.value,model:km.value});const r=await api('/api/settings/test','POST');kerr.className='ok';kerr.textContent='Verbindung klappt ✓ Modell: '+r.model+(r.models&&r.models.length?' · verfügbar: '+r.models.slice(0,8).join(', '):'');if(r.model!==s.model)km.value=r.model}catch(x){kerr.className='err';kerr.textContent=x.message}};
  tf.onsubmit=async e=>{e.preventDefault();try{await api('/api/settings','PUT',{trends:tt.value});terr.className='ok';terr.textContent='Gespeichert ✓'}catch(x){terr.className='err';terr.textContent=x.message}}}

async function viewTeam(){
  const users=await api('/api/users');
  shell('t',`<h1>Team</h1><div class="card">${users.map(u=>`<div class="var"><div><b>${esc(u.name)}</b><small>${esc(u.email)} · ${u.role==='admin'?'Admin':'Berater'}</small></div>${u.id!==me.id?`<div class="acts"><button class="btn warn" data-del="${u.id}">Entfernen</button></div>`:''}</div>`).join('')}</div>
    <h2>Mitarbeiter hinzufügen</h2><form class="card" id="f"><div class="grid2"><div><label for="un">Name</label><input id="un" required></div><div><label for="ue">E-Mail</label><input id="ue" type="email" required></div>
    <div><label for="up">Startpasswort (mind. 10 Zeichen)</label><input id="up" type="text" minlength="10" required></div><div><label for="ur">Rolle</label><select id="ur"><option value="berater">Berater</option><option value="admin">Admin</option></select></div></div>
    <div class="acts"><button class="btn">Hinzufügen</button></div><p class="err" id="err"></p></form>`);
  f.onsubmit=async e=>{e.preventDefault();try{await api('/api/users','POST',{name:un.value,email:ue.value,password:up.value,role:ur.value});viewTeam()}catch(x){err.textContent=x.message}};
  app.querySelector('.card').onclick=async e=>{const b=e.target.closest('[data-del]');if(!b)return;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Wirklich?';return}await api('/api/users/'+b.dataset.del,'DELETE');viewTeam()}}

function viewAccount(){
  shell('k',`<h1>Konto</h1><p>${esc(me.name)} · ${esc(me.email)}</p>${me.role==='admin'?'<h2>Server und Updates</h2><div class="card" id="sys"><p class="muted" style="margin:0">Lädt …</p></div>':''}<h2>Passwort ändern</h2><form class="card" id="f"><label for="c1">Aktuelles Passwort</label><input id="c1" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <label for="c2">Neues Passwort (mind. 10 Zeichen)</label><input id="c2" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" minlength="10" required>
    <label for="c3">Neues Passwort wiederholen</label><input id="c3" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" minlength="10" required>
    <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="sh" style="width:auto"> Passwörter anzeigen</label>
    <div class="acts"><button class="btn">Ändern</button></div><p class="err" id="err"></p></form>
    <div class="acts"><button class="btn line" id="lo">Abmelden</button></div>`);
  sh.onchange=()=>[c1,c2,c3].forEach(i=>i.type=sh.checked?'text':'password');
  f.onsubmit=async e=>{e.preventDefault();err.className='err';
    if(c2.value!==c3.value){err.textContent='Die beiden neuen Passwörter sind nicht gleich.';return}
    if(c2.value.length<10){err.textContent='Neues Passwort: mindestens 10 Zeichen.';return}
    try{await api('/api/me/password','POST',{current:c1.value,next:c2.value});err.className='ok';err.textContent='Passwort geändert ✓ Ab jetzt gilt nur noch das neue Passwort.';f.reset();sh.checked=false;[c1,c2,c3].forEach(i=>i.type='password')}catch(x){err.textContent=x.message}};
  lo.onclick=async()=>{await api('/api/logout','POST');me=null;showLogin()}
  if(me.role==='admin')api('/api/system').then(s=>{const u=s.update,box=document.getElementById('sys');if(!box)return;
    const ok=u&&!/Fehler/.test(u.result);
    box.innerHTML=`<p style="margin:0">App-Version: <b>${esc(s.version)}</b></p>`+(u?`<p style="margin:8px 0 0">Letzte Update-Prüfung: <b>${esc(u.checked)}</b><br>Ergebnis: <b style="color:${ok?'var(--pet)':'var(--bad)'}">${esc(u.result)}</b></p>`
      :'<p class="err" style="margin:8px 0 0">Der Server meldet noch keine automatischen Update-Prüfungen. Die automatischen Updates sind auf diesem Server nicht eingerichtet.</p>')
      +(s.log?`<details class="more"><summary>Protokoll</summary><pre style="white-space:pre-wrap;font-size:12px;margin:8px 0 0;overflow-wrap:anywhere">${esc(s.log)}</pre></details>`:'')}).catch(()=>{})}

async function route(){
  if(!me){try{me=await api('/api/me')}catch(e){return showLogin()}}
  const h=location.hash.slice(1)||'/',m=h.match(/^\/projekt\/(\d+)$/);
  try{if(m)await viewProject(+m[1]);else if(h==='/neu')viewNew();else if(h==='/team'&&me.role==='admin')await viewTeam();else if(h==='/ki'&&me.role==='admin')await viewAi();else if(h==='/konto')viewAccount();else await viewProjects()}
  catch(e){if(me)shell('p',`<p class="err">${esc(e.message)}</p><a class="btn line" href="#/">Zur Übersicht</a>`)}}
addEventListener('hashchange',route);route();
}
</script>
</body>
